output_root_dir: ${oc.env:OUTPUT_ROOT_DIR,./outputs}/aistpp_sync_mfcc_noPreroll_synthBeep
pipeline:
  seed: 19
  stages:
    mfcc_temporal_calibration:
      _target_: kineo.pipeline.stages.mfcc_temporal_calibration.MFCCTemporalCalibrationStage
      name: MFCC Temporal Calibration
      order: 5
      runtime_cfg:
        _target_: kineo.pipeline.stages.mfcc_temporal_calibration.TemporalCalibrationRuntimeConfig
        ref_idx: 0
        confidence_exclusion_duration: 0.1
        drop_audio_before_gt_timeline_jitter_s: 1.0
        beep_period_s: 0.5
        beep_frequency_hz: 1000.0
        beep_duration_s: 0.05
        beep_level_db: 0.0
        correlation_output_path_template: "${output_root_dir}/correlations/{sequence_name}/{view_id}.npz"
    annotations_export:
      _target_: kineo.pipeline.stages.annotations_export.AnnotationsExportStage
      name: Annotations Export
      order: 140
      runtime_cfg:
        _target_: kineo.pipeline.stages.annotations_export.AnnotationsExportRuntimeConfig
        annotations_keys:
        - cameras_temporal
        excluded_annotations_keys: []
        not_found_error: true
        output_path_template: "${output_root_dir}/annotations/{sequence_name}/{annotation_key}.pkl"
