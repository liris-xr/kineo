output_root_dir: "${oc.env:OUTPUT_ROOT_DIR,./outputs}/egohumans_benchmark_nlf_estRt_estK_estDk1k2_4views"
cache_root_dir: "${oc.env:CACHE_ROOT_DIR,./cache}/egohumans_benchmark_nlf_estRt_estK_estDk1k2_4views"
use_cache: False
batch_size: 32
use_half_precision: False
shared_intrinsics: True

pipeline:
  seed: 19

  stages:
    transfer_gt_annotations:
      _target_: kineo.pipeline.stages.transfer_gt_annotations.TransferGroundTruthAnnotationsStage
      name: "Transfer GT Bboxes 2D"
      order: 0
      runtime_cfg:
        _target_: kineo.pipeline.stages.transfer_gt_annotations.TransferGroundTruthAnnotationsRuntimeConfig
        annotations_keys: ["bboxes_2d"]

    # Infer intrinsics before NLF to provide it to the model
    moge_intrinsics_estimation:
      _target_: kineo.pipeline.stages.moge_intrinsics_estimation.MoGeIntrinsicsEstimationStage
      name: "MoGe Intrinsics Estimation"
      model_name_or_path: "./checkpoints/moge-2-vitl-normal.pt"
      order: 10
      runtime_cfg:
        _target_: kineo.pipeline.stages.moge_intrinsics_estimation.MoGeIntrinsicsEstimationRuntimeConfig
        shared_focal_init: False
        use_cache: ${use_cache}
        use_half_precision: ${use_half_precision}
        cache_output_path_template: "${cache_root_dir}/{sequence_name}/{annotation_key}.pkl"

    nlf_skeleton_keypoints_detection:
      _target_: kineo.pipeline.stages.nlf.skeleton_keypoints_detection.NLFSkeletonKeypointsDetectionStage
      name: "NLF Keypoints Detection"
      order: 20
      torchscript_model_path: "./checkpoints/nlf_l_multi_0.3.2.torchscript"
      runtime_cfg:
        _target_: kineo.pipeline.stages.nlf.skeleton_keypoints_detection.NLFSkeletonKeypointsDetectionRuntimeConfig
        batch_size: ${batch_size}
        use_half_precision: ${use_half_precision}
        use_cache: ${use_cache}
        cache_output_path_template: "${cache_root_dir}/{sequence_name}/{annotation_key}.pkl"
        skeleton_name: "coco_19"

    global_time_resampling:
      _target_: kineo.pipeline.stages.global_time_resampling.GlobalTimeResamplingStage
      name: "Global Time Resampling"
      order: 30
      runtime_cfg:
        _target_: kineo.pipeline.stages.global_time_resampling.GlobalTimeResamplingRuntimeConfig
        target_fps: 20
        interpolation_dt_thr_s: 0.3

    keypoints_pairs_sampling:
      _target_: kineo.pipeline.stages.keypoints_pairs_sampling.KeypointsPairsSamplingStage
      name: "Keypoints Pairs Sampling"
      order: 40
      runtime_cfg:
        _target_: kineo.pipeline.stages.keypoints_pairs_sampling.KeypointsPairsSamplingRuntimeConfig
        max_points_pairs: 3000
        pair_avg_conf_score_thr: 0.6

    sfm_camera_extrinsics_initialization:
      _target_: kineo.pipeline.stages.sfm_camera_extrinsics_initialization.SfMCameraExtrinsicsInitializationStage
      name: "SfM Camera Extrinsics Initialization"
      order: 50
      runtime_cfg:
        _target_: kineo.pipeline.stages.sfm_camera_extrinsics_initialization.SfMCameraExtrinsicsInitializationRuntimeConfig
        ransac_confidence: 0.999
        ransac_reproj_threshold: 3.0
        n_refinement_iters: 200
        scale_triplet_weighting: "irls"
        n_scale_irls_iters: 5
        tolerance_grad: 1e-05
        tolerance_change: 1e-09

    bundle_adjustment_sampling:
      _target_: kineo.pipeline.stages.bundle_adjustment_random_sampling.BundleAdjustmentRandomSamplingStage
      name: "Bundle Adjustment Sampling"
      order: 55
      runtime_cfg:
        _target_: kineo.pipeline.stages.bundle_adjustment_random_sampling.BundleAdjustmentRandomSamplingRuntimeConfig
        n_kp_samples_per_view: 50
        min_kp_score: 0.6

    bundle_adjustment_1: # Only optimize camera extrinsics
      _target_: kineo.pipeline.stages.bundle_adjustment.BundleAdjustmentStage
      name: "Bundle Adjustment (First Pass)"
      order: 60
      runtime_cfg:
        _target_: kineo.pipeline.stages.bundle_adjustment.BundleAdjustmentRuntimeConfig
        n_iters: 300
        use_lbfgs: True
        optimize_distortion_coefficients: False
        optimize_focal_length: False
        optimize_principal_point: False
        optimize_rotation: True
        optimize_translation: True
        shared_intrinsics: ${shared_intrinsics}
        huber_delta: 1.0

    bundle_adjustment_2:
      _target_: kineo.pipeline.stages.bundle_adjustment.BundleAdjustmentStage
      name: "Bundle Adjustment (Second Pass)"
      order: 70
      runtime_cfg:
        _target_: kineo.pipeline.stages.bundle_adjustment.BundleAdjustmentRuntimeConfig
        n_iters: 300
        use_lbfgs: True
        optimize_distortion_coefficients: False
        optimize_focal_length: True
        optimize_principal_point: False
        optimize_rotation: True
        optimize_translation: True
        shared_intrinsics: ${shared_intrinsics}
        huber_delta: 1.0

    bundle_adjustment_3:
      _target_: kineo.pipeline.stages.bundle_adjustment.BundleAdjustmentStage
      name: "Bundle Adjustment (Third Pass)"
      order: 80
      runtime_cfg:
        _target_: kineo.pipeline.stages.bundle_adjustment.BundleAdjustmentRuntimeConfig
        n_iters: 300
        use_lbfgs: True
        optimize_distortion_coefficients: [0, 1]
        optimize_focal_length: True
        optimize_principal_point: False
        optimize_rotation: True
        optimize_translation: True
        shared_intrinsics: ${shared_intrinsics}
        huber_delta: 1.0

    mvs_triangulation:
      _target_: kineo.pipeline.stages.mvs_triangulation.MVSTriangulationStage
      name: "MVS Triangulation"
      order: 90
      runtime_cfg:
        _target_: kineo.pipeline.stages.mvs_triangulation.MVSTriangulationRuntimeConfig
        use_eigendecomposition: True
        min_parallax_deg: 10.0

    smpl_global_scale_estimation:
      _target_: kineo.pipeline.stages.smpl_global_scale_estimation.SMPLGlobalScaleEstimationStage
      name: "SMPL Global Scale Estimation"
      joint_regressor_path: "./body_models/smpl/J_regressor_coco19.pt"
      smpl_model_path: "./body_models/smpl/SMPL_NEUTRAL.pkl"
      order: 100
      runtime_cfg:
        _target_: kineo.pipeline.stages.smpl_global_scale_estimation.SMPLGlobalScaleEstimationRuntimeConfig
        n_iters: 100

    global_scale_application:
      _target_: kineo.pipeline.stages.global_scale_application.GlobalScaleApplicationStage
      name: "Global Scale Application"
      order: 110

    scene_reorientation:
      _target_: kineo.pipeline.stages.scene_reorientation.SceneReorientationStage
      name: "Scene Reorientation"
      order: 120
      runtime_cfg:
        _target_: kineo.pipeline.stages.scene_reorientation.SceneReorientationRuntimeConfig
        min_kps_quantile: 0.01

    annotations_export:
      _target_: kineo.pipeline.stages.annotations_export.AnnotationsExportStage
      name: "Annotations Export"
      order: 140
      runtime_cfg:
        _target_: kineo.pipeline.stages.annotations_export.AnnotationsExportRuntimeConfig
        annotations_keys: "*"
        excluded_annotations_keys: []
        not_found_error: True
        output_path_template: "${output_root_dir}/annotations/{sequence_name}/{annotation_key}.pkl"

    metrics_export:
      _target_: kineo.pipeline.stages.metrics_export.MetricsExportStage
      name: "Metrics Export"
      order: 150
      runtime_cfg:
        _target_: kineo.pipeline.stages.metrics_export.MetricsExportRuntimeConfig
        output_path_template: "${output_root_dir}/metrics/{sequence_name}.json"
