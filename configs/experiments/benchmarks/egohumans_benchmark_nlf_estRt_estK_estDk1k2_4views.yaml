# EgoHumans benchmark, 4-view setting.
#
# Camera sets follow HSfM (Muller & Choi et al., "Reconstructing People,
# Places, and Cameras", CVPR 2025), supplementary S.4.2, which lists one
# camera configuration per activity for each of the 2-, 4- and 8-view
# settings. The main-paper tables report the 4-view case; Table S.1 adds
# 2- and 8-view. Paper "camera N" maps to view id "camNN".
#
# camera_selection below is fully resolved per sequence. Where a sequence
# cannot supply a camera the paper names, the nearest available camera id
# not already selected is substituted (ties to the lower id) and the line
# carries a comment saying which camera was replaced and why. HSfM's own
# rule (Table S.1 caption) is to exclude such samples instead; we keep them
# for coverage, so per-activity numbers on badminton and fencing are not
# strictly comparable to the paper. fencing_014 is the worst case, 4 of 8
# cameras replaced out of only 9 available views.
#
# Resolved against the 131-sequence snapshot. A sequence absent from this
# table is skipped by experiments/egohumans_eval.py, so re-preprocessing the
# dataset with different camera availability needs this block regenerated.

