[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kineo"
version = "0.1.0"
description = "Kineo: Calibration-Free Metric Motion Capture From Sparse RGB Cameras"
authors = [
    { name = "Charles JAVERLIAT", email = "charles.javerliat@gmail.com" },
]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "onnxruntime-gpu",
    "orjson",
    "kornia",
    "tqdm",
    "pyglet",
    "roma",
    "opencv-python",
    "hydra-core",
    "soundfile",
    "yacs",
    "spacepy",
    "rerun-sdk",
    "cv2-enumerate-cameras",
    "smplx", "google-auth", "google-auth-oauthlib>=1.4.0,<2", "google-api-python-client",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
]

[project.optional-dependencies]
dev = ["ruff", "pytest", "pyrefly", "google-api-python-client"]

[project.scripts]
kineo-offline = "kineo.demo.offline.demo:cli"
kineo-online = "kineo.demo.online.demo:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["kineo*"]

[tool.pixi.workspace]
channels = ["conda-forge", "nvidia"]
platforms = ["linux-64", "win-64"]

[tool.pixi.pypi-dependencies]
kineo = { path = ".", editable = true }
# Every git dependency is pinned to the revision the lock resolved and the
# environment actually holds. Left floating, each follows its branch and a
# re-solve silently swaps the code a benchmark ran on -- for MoGe that means
# MoGe-3, which is a different model and pulls torch from its own cu130 index.
moge = { git = "https://github.com/microsoft/MoGe.git", rev = "07444410f1e33f402353b99d6ccd26bd31e469e8" }

torch = { version = "==2.10.*", index = "https://download.pytorch.org/whl/cu128" }
torchvision = { version = "==0.25.0", index = "https://download.pytorch.org/whl/cu128" }
torchaudio = { version = "==2.10.*", index = "https://download.pytorch.org/whl/cu128" }
onnxruntime-gpu = "*"
soundfile = "*"
cv2-enumerate-cameras = "*"

sam2 = { git = "https://github.com/cjaverliat/sam2.git", rev = "6f43c2eb3db1da4811a8165f64ac23616f16dd36" }


[tool.pixi.pypi-options]
# mmcv names its prebuilt wheel after the torch it can import at build time,
# so an isolated build env names it after that env's throwaway CPU torch.
no-build-isolation = ["sam2", "chumpy", "mmcv"]

[tool.pixi.dependencies]
python = "3.10.*"
pip = "*"
hf-transfer = "*"
huggingface_hub = "*"
curl = "*"
git = "*"
requests = ">=2.34.2,<3"

[tool.pixi.pypi-options.dependency-overrides]
iopath = ">=0.1.10"

[tool.pixi.feature.dev]
platforms = ["linux-64", "win-64"]
channels = ["conda-forge"]

[tool.pixi.feature.dev.dependencies]
ruff = "*"
pytest = "*"
pyrefly = "*"
google-api-python-client = "*"

# MMLab only reaches the four stages that actually run MMLab inference
# (mmpose_keypoints_detection, mmdet_bbox_detection, mmlab_bbox_keypoints_detection,
# sam2_semiauto_bbox_detection). Those are hydra `_target_`-loaded, so they import
# lazily and a config that does not name them never touches this stack. Kept out
# of the default environment because installing it means building mmcv from git
# unless a prebuilt wheel matching the pinned torch exists.
[tool.pixi.feature.mmlab]
platforms = ["linux-64", "win-64"]
channels = ["conda-forge", "nvidia"]

[tool.pixi.feature.mmlab.pypi-dependencies]
mmpretrain = "*"
mmengine = "*"
mmcv = { git = "https://github.com/cjaverliat/mmcv.git", rev = "d2ac7cfdd53bca611be00630e1ec84f18565e2a4" }
mmpose = { git = "https://github.com/cjaverliat/mmpose.git", rev = "111d9b3a1e15d417925e5bf66211fe1b4517ae6c" }
mmdet = { git = "https://github.com/cjaverliat/mmdetection.git", rev = "2c6c427aad632694494c9bb17d6239f163e4ab04" }
mmdeploy = "*"

[tool.pixi.feature.cuda128]
platforms = ["linux-64", "win-64"]
channels = ["conda-forge", "nvidia"]

[tool.pixi.feature.cuda128.system-requirements]
cuda = "12.8"

[tool.pixi.feature.cuda128.dependencies]
cuda-version = "12.8.*"
cuda-nvcc = "*"
cuda-nvrtc = "*"
cuda-nvtx = "*"
cuda-profiler-api = "*"
cudnn = "*"

[tool.pixi.environments]

[tool.pixi.environments.default]
features = ["cuda128"]
solve-group = "default"

[tool.pixi.environments.dev]
features = ["dev", "cuda128"]
solve-group = "default"

[tool.pixi.environments.mmlab]
features = ["mmlab", "cuda128"]

[tool.pixi.tasks]
_download-smpl = { cmd = "test -f body_models/smpl/SMPL_NEUTRAL.pkl || python scripts/download_smpl.py" }
_download-smplx = { cmd = "(test -f body_models/smplx/SMPLX_NEUTRAL.pkl && test -f body_models/smplx/SMPLX_NEUTRAL.npz) || python scripts/download_smplx.py" }

_download_nlf = { cmd = "test -f checkpoints/nlf_l_multi_0.3.2.torchscript || (mkdir -p checkpoints && curl -L https://github.com/isarandi/nlf/releases/download/v0.3.2/nlf_l_multi_0.3.2.torchscript -o checkpoints/nlf_l_multi_0.3.2.torchscript)", outputs = [
    "checkpoints/nlf_l_multi_0.3.2.torchscript",
], description = "Download NLF TorchScript model" }

_download_efficienttam_cfg = { cmd = "test -f configs/efficienttam/efficienttam_s.yaml || (mkdir -p configs/efficienttam && curl -L https://raw.githubusercontent.com/yformer/EfficientTAM/main/efficient_track_anything/configs/efficienttam/efficienttam_s.yaml -o configs/efficienttam/efficienttam_s.yaml)", outputs = [
    "configs/efficienttam/efficienttam_s.yaml",
], description = "Download EfficientTAM config" }

_download_efficienttam_weights = { cmd = "test -f checkpoints/efficienttam_s.pt || (mkdir -p checkpoints && hf download yunyangx/efficient-track-anything efficienttam_s.pt --repo-type model --local-dir checkpoints)", outputs = [
    "checkpoints/efficienttam_s.pt",
], description = "Download EfficientTAM weights" }

_download_moge = { cmd = "test -f checkpoints/moge-2-vitl-normal.pt || (mkdir -p checkpoints && hf download Ruicheng/moge-2-vitl-normal model.pt --repo-type model --local-dir checkpoints && mv checkpoints/model.pt checkpoints/moge-2-vitl-normal.pt)", outputs = [
    "checkpoints/moge-2-vitl-normal.pt",
], description = "Download MoGe model" }

_download_yolox = { cmd = "python -c \"from kineo.pipeline.stages.rtmlib.tools.file import download_checkpoint; print(download_checkpoint('https://download.openmmlab.com/mmpose/v1/projects/rtmposev1/onnx_sdk/yolox_tiny_8xb8-300e_humanart-6f3252f9.zip', dst_dir='checkpoints/', progress=True))\"", outputs = [
    "checkpoints/yolox_tiny_8xb8-300e_humanart-6f3252f9.onnx",
], description = "Prefetch YOLOX ONNX for rtmlib" }

download-checkpoints = { depends-on = [
    "_download_nlf",
    "_download_efficienttam_cfg",
    "_download_efficienttam_weights",
    "_download_moge",
    "_download_yolox",
    "_download-smpl",
    "_download-smplx"
], description = "Download all checkpoints" }

kineo-offline = { depends-on = ["download-checkpoints"], cmd = "kineo-offline" }
kineo-online = { depends-on = ["download-checkpoints"], cmd = "kineo-online" }

lock = { cmd = "pixi lock", description = "Refresh pixi lockfiles" }

[tool.pixi.tasks.h36m-download]
args = ["dataset_dir"]
cmd = "python scripts/download_h36m_dataset.py {{ dataset_dir }}"

[tool.pixi.tasks.h36m-preprocess]
args = ["dataset_dir"]
cmd = "test -f {{ dataset_dir }}/annotations/protocol1/val/ || python scripts/preprocess_h36m_dataset.py {{ dataset_dir }}"

[tool.pixi.tasks.h36m-benchmark]
depends-on = ["download-checkpoints"]
args = [
    { "arg" = "dataset_dir" },
    { "arg" = "config_file", "default" = "configs/experiments/benchmarks/h36m_benchmark_nlf_estRt_estK_estD.yaml" },
]
cmd = "python experiments/h36m_eval.py {{ dataset_dir }} --config-file {{config_file}}"

[tool.pixi.tasks.egohumans-download]
args = ["dataset_dir"]
cmd = "python scripts/download_egohumans_dataset.py {{ dataset_dir }}"

[tool.pixi.tasks.egohumans-preprocess]
args = ["dataset_dir"]
cmd = "python scripts/preprocess_egohumans_dataset.py {{ dataset_dir }}"

[tool.pixi.tasks.egohumans-benchmark]
depends-on = ["download-checkpoints"]
args = [
    { "arg" = "dataset_dir" },
    { "arg" = "config_file", "default" = "configs/experiments/benchmarks/egohumans_benchmark_nlf_estRt_estK_estD.yaml" },
]
cmd = "python experiments/egohumans_eval.py {{ dataset_dir }} --config-file {{config_file}}"

[tool.pixi.tasks.chime6-download]
args = ["dataset_dir"]
cmd = "python scripts/download_chime6_dataset.py {{ dataset_dir }}"

[tool.pixi.tasks.chime6-preprocess]
args = ["dataset_dir"]
cmd = "python scripts/preprocess_chime6_dataset.py {{ dataset_dir }}"

[tool.pixi.tasks.chime6-sync-eval]
args = [
    { "arg" = "dataset_dir" },
    { "arg" = "output_dir", "default" = "outputs/chime6_sync" },
]
cmd = "python experiments/chime6_audio_sync_eval.py {{ dataset_dir }} {{ output_dir }}"

[tool.pixi.tasks.aistpp-download]
args = ["dataset_dir"]
cmd = "python scripts/download_aistpp_dataset.py {{ dataset_dir }}"

[tool.pixi.tasks.aistpp-preprocess]
args = ["dataset_dir"]
cmd = "python scripts/preprocess_aistpp_dataset.py {{ dataset_dir }}"

[tool.pixi.tasks.aistpp-benchmark]
depends-on = ["download-checkpoints"]
args = [
    { "arg" = "dataset_dir" },
    { "arg" = "config_file", "default" = "configs/experiments/benchmarks/aistpp_benchmark_nlf_estRt_estK_estDk1k2.yaml" },
]
cmd = "python experiments/aistpp_eval.py {{ dataset_dir }} --config-file {{config_file}}"
