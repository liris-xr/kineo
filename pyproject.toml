[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kineo"
version = "0.1.0"
description = "Kineo: Calibration-Free Metric Motion Capture From Sparse RGB Cameras"
authors = [
    { name = "Charles JAVERLIAT", email = "charles.javerliat@gmail.com" },
]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "onnxruntime-gpu",
    "orjson",
    "kornia",
    "tqdm",
    "pyglet",
    "roma",
    "opencv-python",
    "hydra-core",
    "soundfile",
    "yacs",
    "spacepy",
    "rerun-sdk",
    "cv2-enumerate-cameras",
    "smplx", "google-auth", "google-auth-oauthlib>=1.4.0,<2", "google-api-python-client",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
]

[project.optional-dependencies]
dev = ["ruff", "pytest", "pyrefly", "google-api-python-client"]

[project.scripts]
kineo-offline = "kineo.demo.offline.demo:cli"
kineo-online = "kineo.demo.online.demo:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["kineo*"]

[tool.pixi.workspace]
channels = ["conda-forge", "nvidia"]
platforms = ["linux-64", "win-64"]

[tool.pixi.pypi-dependencies]
kineo = { path = ".", editable = true }
# Pinned: MoGe-3 (main) forces torch through its own cu130 index, which
# conflicts with the cu128 pin below and makes the solve fail.
moge = { git = "https://github.com/microsoft/MoGe.git", rev = "925b8ed835a7a9cdb7578ba15c658a0afc969030" }

torch = { version = "==2.11.*", index = "https://download.pytorch.org/whl/cu128" }
torchvision = { version = ">=0.22.0", index = "https://download.pytorch.org/whl/cu128" }
torchaudio = { version = "==2.11.*", index = "https://download.pytorch.org/whl/cu128" }
onnxruntime-gpu = "*"
soundfile = "*"
cv2-enumerate-cameras = "*"

sam2 = { git = "https://github.com/cjaverliat/sam2.git", tag = "v1.2.0" }

# The last xtcocotools release (1.14.3, 2023) only ships wheels built
# against the numpy 1.x ABI, which abort on import under numpy 2.
# Master builds from source and works; there is no release with the fix.
xtcocotools = { git = "https://github.com/jin-s13/xtcocoapi.git", rev = "17252e742ed4306a6323d74055f4c15c75cba6ad" }

mmengine = "*"
mmcv = { git = "https://github.com/cjaverliat/mmcv.git", tag = "v2.3.0" }
mmpose = { git = "https://github.com/cjaverliat/mmpose.git" }
mmdet = { git = "https://github.com/cjaverliat/mmdetection.git" }
aitviewer = ">=1.14.2"

[tool.pixi.pypi-options]
no-build-isolation = ["sam2", "chumpy", "mmcv", "mmdet"]

[tool.pixi.dependencies]
python = "3.10.*"
pip = "*"
setuptools = "<82"
hf-transfer = "*"
huggingface_hub = "*"
curl = "*"
requests = ">=2.34.2,<3"

[tool.pixi.pypi-options.dependency-overrides]
iopath = ">=0.1.10"

[tool.pixi.feature.dev]
platforms = ["linux-64", "win-64"]
channels = ["conda-forge"]

[tool.pixi.feature.dev.dependencies]
ruff = "*"
pytest = "*"
pyrefly = "*"
google-api-python-client = "*"

[tool.pixi.feature.cuda128]
platforms = ["linux-64", "win-64"]
channels = ["conda-forge", "nvidia"]

[tool.pixi.feature.cuda128.system-requirements]
cuda = "12.8"

[tool.pixi.feature.cuda128.dependencies]
cuda-version = "12.8.*"
cuda-nvcc = "*"
cuda-nvrtc = "*"
cuda-nvtx = "*"
cuda-profiler-api = "*"
# cuda-nvcc ships the compiler but not the toolkit headers torch's ATen includes.
cuda-libraries-dev = "*"
cudnn = "*"

[tool.pixi.environments]

[tool.pixi.environments.default]
features = ["cuda128"]
solve-group = "default"

[tool.pixi.environments.dev]
features = ["dev", "cuda128"]
solve-group = "default"

[tool.pixi.tasks]
_download-smpl = { cmd = "python -c 'import os,sys; sys.exit(0 if os.path.exists(\"body_models/smpl/SMPL_NEUTRAL.pkl\") else 1)' || python scripts/download_smpl.py" }
_download-smplx = { cmd = "python -c 'import os,sys; sys.exit(0 if all(map(os.path.exists, [\"body_models/smplx/SMPLX_NEUTRAL.pkl\", \"body_models/smplx/SMPLX_NEUTRAL.npz\"])) else 1)' || python scripts/download_smplx.py" }

_download_nlf = { cmd = "python -c 'import os,sys; sys.exit(0 if os.path.exists(\"checkpoints/nlf_l_multi_0.3.2.torchscript\") else 1)' || (mkdir -p checkpoints && curl -L https://github.com/isarandi/nlf/releases/download/v0.3.2/nlf_l_multi_0.3.2.torchscript -o checkpoints/nlf_l_multi_0.3.2.torchscript)", outputs = [
    "checkpoints/nlf_l_multi_0.3.2.torchscript",
], description = "Download NLF TorchScript model" }

_download_efficienttam_cfg = { cmd = "python -c 'import os,sys; sys.exit(0 if os.path.exists(\"configs/efficienttam/efficienttam_s.yaml\") else 1)' || (mkdir -p configs/efficienttam && curl -L https://raw.githubusercontent.com/yformer/EfficientTAM/main/efficient_track_anything/configs/efficienttam/efficienttam_s.yaml -o configs/efficienttam/efficienttam_s.yaml)", outputs = [
    "configs/efficienttam/efficienttam_s.yaml",
], description = "Download EfficientTAM config" }

_download_efficienttam_weights = { cmd = "python -c 'import os,sys; sys.exit(0 if os.path.exists(\"checkpoints/efficienttam_s.pt\") else 1)' || (mkdir -p checkpoints && hf download yunyangx/efficient-track-anything efficienttam_s.pt --repo-type model --local-dir checkpoints)", outputs = [
    "checkpoints/efficienttam_s.pt",
], description = "Download EfficientTAM weights" }

_download_moge = { cmd = "python -c 'import os,sys; sys.exit(0 if os.path.exists(\"checkpoints/moge-2-vitl-normal.pt\") else 1)' || (mkdir -p checkpoints && hf download Ruicheng/moge-2-vitl-normal model.pt --repo-type model --local-dir checkpoints && mv checkpoints/model.pt checkpoints/moge-2-vitl-normal.pt)", outputs = [
    "checkpoints/moge-2-vitl-normal.pt",
], description = "Download MoGe model" }

_download_rtmpose_h36m = { cmd = "python -c 'import os,sys; sys.exit(0 if os.path.exists(\"checkpoints/rtmpose_h36m.pth\") else 1)' || (mkdir -p checkpoints && hf download charlesjvt/rtmpose-l-h36m-384x288 rtmpose_h36m.pth --repo-type model --local-dir checkpoints)", outputs = [
    "checkpoints/rtmpose_h36m.pth",
], description = "Download RTMPose H3.6M weights" }

_download_yolox = { cmd = "python -c \"from kineo.pipeline.stages.rtmlib.tools.file import download_checkpoint; print(download_checkpoint('https://download.openmmlab.com/mmpose/v1/projects/rtmposev1/onnx_sdk/yolox_tiny_8xb8-300e_humanart-6f3252f9.zip', dst_dir='checkpoints/', progress=True))\"", outputs = [
    "checkpoints/yolox_tiny_8xb8-300e_humanart-6f3252f9.onnx",
], description = "Prefetch YOLOX ONNX for rtmlib" }

download-checkpoints = { depends-on = [
    "_download_nlf",
    "_download_efficienttam_cfg",
    "_download_efficienttam_weights",
    "_download_moge",
    "_download_rtmpose_h36m",
    "_download_yolox",
    "_download-smpl",
    "_download-smplx"
], description = "Download all checkpoints" }

kineo-offline = { depends-on = ["download-checkpoints"], cmd = "kineo-offline" }
kineo-online = { depends-on = ["download-checkpoints"], cmd = "kineo-online" }

lock = { cmd = "pixi lock", description = "Refresh pixi lockfiles" }

[tool.pixi.tasks.h36m-download]
args = ["dataset_dir"]
cmd = "python scripts/download_h36m_dataset.py {{ dataset_dir }}"

[tool.pixi.tasks.h36m-preprocess]
args = ["dataset_dir"]
cmd = "python -c 'import os,sys; sys.exit(0 if os.path.exists(\"{{ dataset_dir }}/h36m_protocol1_sequences.json\") else 1)' || python scripts/preprocess_h36m_dataset.py {{ dataset_dir }}"

[tool.pixi.tasks.h36m-benchmark]
depends-on = ["download-checkpoints"]
args = [
    { "arg" = "dataset_dir" },
    { "arg" = "config_file", "default" = "configs/experiments/benchmarks/h36m_benchmark_nlf_estRt_estK_estDk1k2.yaml" },
]
cmd = "python experiments/h36m_eval.py {{ dataset_dir }} --config-file {{config_file}}"

[tool.pixi.tasks.egohumans-download]
args = ["dataset_dir"]
cmd = "python scripts/download_egohumans_dataset.py {{ dataset_dir }}"

[tool.pixi.tasks.egohumans-preprocess]
args = ["dataset_dir"]
cmd = "python scripts/preprocess_egohumans_dataset.py {{ dataset_dir }}"

[tool.pixi.tasks.egohumans-benchmark]
depends-on = ["download-checkpoints"]
args = [
    { "arg" = "dataset_dir" },
    { "arg" = "config_file", "default" = "configs/experiments/benchmarks/egohumans_benchmark_nlf_estRt_estK_estDk1k2.yaml" },
]
cmd = "python experiments/egohumans_eval.py {{ dataset_dir }} --config-file {{config_file}}"

[tool.pixi.tasks.chime6-windows]
args = [
    { "arg" = "dataset_dir" },
    { "arg" = "output_json", "default" = "experiments/data/chime6_windows.json" },
]
cmd = "python experiments/chime6_window_selection.py {{ dataset_dir }} {{ output_json }}"

[tool.pixi.tasks.chime6-sync-eval]
args = [
    { "arg" = "dataset_dir" },
    { "arg" = "windows_json", "default" = "experiments/data/chime6_windows.json" },
    { "arg" = "output_dir", "default" = "outputs/chime6_sync" },
]
cmd = "python experiments/chime6_audio_sync_eval.py {{ dataset_dir }} {{ windows_json }} {{ output_dir }}"

[tool.pixi.tasks.aistpp-download]
args = ["dataset_dir"]
cmd = "python scripts/download_aistpp_dataset.py {{ dataset_dir }}"

[tool.pixi.tasks.aistpp-preprocess]
args = ["dataset_dir"]
cmd = "python scripts/preprocess_aistpp_dataset.py {{ dataset_dir }}"

[tool.pixi.tasks.panoptic-download]
args = ["dataset_dir"]
cmd = "python scripts/download_panoptic_dataset.py {{ dataset_dir }}"

[tool.pixi.tasks.panoptic-preprocess]
args = ["dataset_dir"]
cmd = "python scripts/preprocess_panoptic_dataset.py {{ dataset_dir }}"

[tool.pixi.tasks.panoptic-benchmark]
depends-on = ["download-checkpoints"]
args = [
    { "arg" = "dataset_dir" },
    { "arg" = "config_file", "default" = "configs/experiments/benchmarks/panoptic_benchmark_nlf_estRt_estK_estDk1k2.yaml" },
]
cmd = "python experiments/panoptic_eval.py {{ dataset_dir }} --config-file {{config_file}}"
